<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Positif Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b1014;--text:#e8eef0;--muted:#7f8e93;--g:#7CC080;
--c-print:#48cae4;--c-video:#4CAF50;--c-pickup:#2ec4b6;--c-sticker:#818cf8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
background:radial-gradient(500px 360px at 15% 20%,#48cae426,transparent 70%),radial-gradient(520px 380px at 85% 30%,#4CAF5022,transparent 70%),radial-gradient(560px 400px at 50% 100%,#2ec4b622,transparent 70%),radial-gradient(420px 320px at 90% 85%,#818cf822,transparent 70%),
linear-gradient(#ffffff08 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,#ffffff08 1px,transparent 1px) 0 0/48px 48px}
main{position:relative;z-index:1;width:100%;max-width:620px;display:flex;flex-direction:column;align-items:center;gap:clamp(36px,7vw,64px)}
.logo{width:min(440px,82vw);height:auto;display:block;filter:drop-shadow(0 0 28px #7CC08040)}
nav{display:flex;flex-direction:column;gap:14px;width:100%}
.app{--c:var(--g);display:flex;align-items:center;gap:clamp(16px,4vw,28px);padding:14px 20px;border-radius:18px;text-decoration:none;color:var(--c);border:1px solid #ffffff12;background:#ffffff06;font-weight:800;font-size:clamp(24px,5.6vw,40px);letter-spacing:-.01em;transition:transform .2s,background .2s,border-color .2s,box-shadow .2s}
.app:hover,.app:focus-visible{transform:translateX(8px);background:color-mix(in srgb,var(--c) 12%,transparent);border-color:var(--c);box-shadow:0 0 30px color-mix(in srgb,var(--c) 25%,transparent);outline:none}
.ico{flex:none;width:clamp(48px,10vw,64px);aspect-ratio:1;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,#0b1014);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.ico svg{width:56%;height:56%;fill:none;stroke:var(--c);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.arrow{margin-left:auto;font-size:.7em;opacity:0;transform:translateX(-8px);transition:.2s}
.app:hover .arrow,.app:focus-visible .arrow{opacity:1;transform:none}
footer{position:relative;z-index:1;margin-top:48px;color:var(--muted);font-size:13px;font-weight:500}
</style></head><body>
